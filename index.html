<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snake Game</title>
<style>
  body { margin:0; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; background:#14161c; color:#e8e8e8; font-family:system-ui,sans-serif; }
  h1 { margin:0 0 8px; font-size:1.4rem; }
  #info { margin-bottom:8px; font-size:1rem; }
  canvas { background:#1d2029; border:2px solid #3a3f4f; border-radius:8px; max-width:95vw; }
  p { color:#9aa; font-size:.85rem; }
</style>
</head>
<body>
<h1>🐍 Snake Game</h1>
<div id="info">Score: <b id="score">0</b> &nbsp;|&nbsp; Best: <b id="best">0</b></div>
<canvas id="c" width="400" height="400"></canvas>
<p>Steer with the arrow keys or WASD. Press Space to start and to retry.</p>

<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
const SIZE = 20, N = canvas.width / SIZE;
let snake, dir, nextDir, food, score, loop, running;
let best = 0;
try { best = +localStorage.getItem("yilan-best") || 0; } catch (e) {}
document.getElementById("best").textContent = best;

function placeFood() {
  do {
    food = { x: Math.floor(Math.random() * N), y: Math.floor(Math.random() * N) };
  } while (snake.some(s => s.x === food.x && s.y === food.y));
}

function start() {
  snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
  dir = nextDir = { x: 1, y: 0 };
  score = 0;
  document.getElementById("score").textContent = 0;
  placeFood();
  running = true;
  clearInterval(loop);
  loop = setInterval(tick, 110);
  draw();
}

function tick() {
  dir = nextDir;
  const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
  const hitWall = head.x < 0 || head.y < 0 || head.x >= N || head.y >= N;
  const hitSelf = snake.some(s => s.x === head.x && s.y === head.y);
  if (hitWall || hitSelf) return gameOver();
  snake.unshift(head);
  if (head.x === food.x && head.y === food.y) {
    score++;
    document.getElementById("score").textContent = score;
    placeFood();
  } else {
    snake.pop();
  }
  draw();
}

function gameOver() {
  running = false;
  clearInterval(loop);
  if (score > best) {
    best = score;
    document.getElementById("best").textContent = best;
    try { localStorage.setItem("yilan-best", best); } catch (e) {}
  }
  draw();
  ctx.fillStyle = "rgba(0,0,0,.65)";
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = "#fff";
  ctx.textAlign = "center";
  ctx.font = "bold 28px system-ui";
  ctx.fillText("Game Over", canvas.width / 2, 190);
  ctx.font = "16px system-ui";
  ctx.fillText("Press Space to play again", canvas.width / 2, 220);
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = "#ff5a5f";
  ctx.beginPath();
  ctx.arc(food.x * SIZE + SIZE / 2, food.y * SIZE + SIZE / 2, SIZE / 2 - 2, 0, Math.PI * 2);
  ctx.fill();
  snake.forEach((s, i) => {
    ctx.fillStyle = i === 0 ? "#7CFC9A" : "#3fbf6b";
    ctx.fillRect(s.x * SIZE + 1, s.y * SIZE + 1, SIZE - 2, SIZE - 2);
  });
}

const keys = {
  ArrowUp: [0, -1], w: [0, -1], W: [0, -1],
  ArrowDown: [0, 1], s: [0, 1], S: [0, 1],
  ArrowLeft: [-1, 0], a: [-1, 0], A: [-1, 0],
  ArrowRight: [1, 0], d: [1, 0], D: [1, 0],
};

document.addEventListener("keydown", e => {
  if (e.code === "Space") { e.preventDefault(); if (!running) start(); return; }
  const k = keys[e.key];
  if (!k || !running) return;
  e.preventDefault();
  // prevent reversing into yourself
  if (k[0] === -dir.x && k[1] === -dir.y) return;
  nextDir = { x: k[0], y: k[1] };
});

// Start screen
snake = [{ x: 10, y: 10 }]; food = { x: 15, y: 10 }; running = false;
draw();
ctx.fillStyle = "rgba(0,0,0,.55)";
ctx.fillRect(0, 0, canvas.width, canvas.height);
ctx.fillStyle = "#fff";
ctx.textAlign = "center";
ctx.font = "bold 22px system-ui";
ctx.fillText("Press Space to start", canvas.width / 2, 205);
</script>
</body>
</html>
